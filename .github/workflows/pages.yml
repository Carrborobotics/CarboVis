# Publishes the web version (phones, Macs, any browser) to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
name: Web version
on:
  push:
    branches: [main]
    paths: ['source/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python source/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: desktop/web
      - id: deploy
        uses: actions/deploy-pages@v5
